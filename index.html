          document.documentElement.dataset.theme = theme;
          document.querySelectorAll('.reader').forEach((reader) => {
            reader.dataset.fontSize = fontSize;
            reader.dataset.lineHeight = lineHeight;
          });
          document.querySelectorAll('[data-setting-value]').forEach((node) => {
            const key = node.dataset.settingKey;
            const value = node.dataset.settingValue;
            node.setAttribute('aria-pressed', String(localStorage.getItem(key) === value));
          });
        };
        const renderLists = () => {
          const favorites = getJson('favorites', []);
          const recent = getJson('recentStories', []);
          document.querySelectorAll('[data-favorite-list]').forEach((node) => {
            node.innerHTML = favorites.length
              ? favorites.map(storyListItem).join('')
              : '<li class="meta">尚未收藏故事。</li>';
          });
          document.querySelectorAll('[data-recent-list]').forEach((node) => {
            node.innerHTML = recent.length
              ? recent.map(storyListItem).join('')
              : '<li class="meta">尚無最近閱讀紀錄。</li>';
          });
          document.querySelectorAll('[data-favorite-toggle]').forEach((button) => {
            const slug = button.dataset.slug;
            button.setAttribute('aria-pressed', String(favorites.includes(slug)));
            button.textContent = favorites.includes(slug) ? '♥ 已收藏' : '♡ 收藏';
          });
        };
        document.addEventListener('click', (event) => {
          const target = event.target.closest('[data-action]');
          if (!target) return;
          const action = target.dataset.action;
          if (action === 'set-setting') {
            localStorage.setItem(target.dataset.settingKey, target.dataset.settingValue);
            applyReader();
          }
          if (action === 'toggle-favorite') {
            const slug = target.dataset.slug;
            const favorites = getJson('favorites', []);
            const next = favorites.includes(slug)
              ? favorites.filter((item) => item !== slug)
              : [slug, ...favorites];
            setJson('favorites', next);
            renderLists();
          }
          if (action === 'print') window.print();
        });
        const story = document.querySelector('[data-story-slug]');
        if (story) {
          const slug = story.dataset.storySlug;
          const recent = getJson('recentStories', []).filter((item) => item !== slug);
          setJson('recentStories', [slug, ...recent].slice(0, 12));
        }
        applyReader();
        renderLists();
      })();
    })();</script> </body> </html>
