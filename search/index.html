:"蔡瑞月—臺灣現代舞的開拓者","main_3_29":"鄧雨賢—四、月、望、雨","main_3_3":"江文也—白鷺鷥的鄉愁","main_3_30":"蕭泰然—福爾摩沙的音樂天使","main_3_31":"賴和—臺灣新文學之父","main_3_32":"鍾理和—客家原鄉人文學","main_3_33":"鍾肇政—靈潭畔的筆耕者","main_3_4":"李天祿—深耕臺灣布袋戲","main_3_5":"李安—臥虎藏龍的電影人生","main_3_6":"李哲洋—採歌人","main_3_7":"李泰祥—來自馬蘭的作曲家","main_3_8":"李梅樹—鄉土寫實畫家","main_3_9":"李澤藩—愛與美的畫家","main_4_1":"八田與一—嘉南大圳之父","main_4_10":"黑名單—鮭魚返鄉的故事","main_4_11":"寒熱仔（麻拉里亞）消失了","main_4_12":"臺灣藝陣的傳承與創新—九天民俗技藝團","main_4_13":"劉金標—打造捷安特國際品牌","main_4_14":"蔣渭水—文化協會的靈魂","main_4_2":"小學生做外交—前進斯里蘭卡","main_4_3":"李萬居、吳三連—為臺灣發聲的報人","main_4_4":"林茂生—臺灣第一位博士教育家","main_4_5":"林義傑—不停前進的臺灣長跑健將","main_4_6":"連加恩—臺灣醫生非洲行腳","main_4_7":"郭雨新—牛背上的民主騎士","main_4_8":"郭婞淳—舉重若輕的世界級臺灣女力","main_4_9":"陳五福—噶瑪蘭的燭光"};
const baseUrl = "/101TWstory/";

      (() => {
        const getJson = (key, fallback) => {
          try {
            return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback));
          } catch {
            return fallback;
          }
        };
        const setJson = (key, value) => localStorage.setItem(key, JSON.stringify(value));
        const escapeHtml = (value) =>
          String(value).replace(/[&<>"']/g, (char) => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]
          ));
        const storyListItem = (slug) => {
          const safeSlug = String(slug);
          const label = storyTitles[safeSlug] || safeSlug;
          return `<li><a href="${baseUrl}stories/${encodeURIComponent(safeSlug)}/">${escapeHtml(label)}</a></li>`;
        };
        const applyReader = () => {
          const mode = localStorage.getItem('readingMode') || 'original';
          const fontSize = localStorage.getItem('fontSize') || 'medium';
          const lineHeight = localStorage.getItem('lineHeight') || 'wide';
          const theme = localStorage.getItem('theme') || 'warm';
          document.documentElement.dataset.readingMode = mode;
          document.documentElement.dataset.theme = theme;
          document.querySelectorAll('.reader').forEach((reader) => {
            reader.dataset.fontSize = fontSize;
            reader.dataset.lineHeight = lineHeight;
          });
          document.querySelectorAll('[data-setting-value]').forEach((node) => {
            const key = node.dataset.settingKey;
            const value = node.dataset.settingValue;
            node.setAttribute('aria-pressed', String(localStorage.getItem(key) === value));
          });
        };
        const renderLists = () => {
          const favorites = getJson('favorites', []);
          const recent = getJson('recentStories', []);
          document.querySelectorAll('[data-favorite-list]').forEach((node) => {
            node.innerHTML = favorites.length
              ? favorites.map(storyListItem).join('')
              : '<li class="meta">尚未收藏故事。</li>';
          });
          document.querySelectorAll('[data-recent-list]').forEach((node) => {
            node.innerHTML = recent.length
              ? recent.map(storyListItem).join('')
              : '<li class="meta">尚無最近閱讀紀錄。</li>';
          });
          document.querySelectorAll('[data-favorite-toggle]').forEach((button) => {
            const slug = button.dataset.slug;
            button.setAttribute('aria-pressed', String(favorites.includes(slug)));
            button.textContent = favorites.includes(slug) ? '♥ 已收藏' : '♡ 收藏';
          });
        };
        document.addEventListener('click', (event) => {
          const target = event.target.closest('[data-action]');
          if (!target) return;
          const action = target.dataset.action;
          if (action === 'set-setting') {
            localStorage.setItem(target.dataset.settingKey, target.dataset.settingValue);
            applyReader();
          }
          if (action === 'toggle-favorite') {
            const slug = target.dataset.slug;
            const favorites = getJson('favorites', []);
            const next = favorites.includes(slug)
              ? favorites.filter((item) => item !== slug)
              : [slug, ...favorites];
            setJson('favorites', next);
            renderLists();
          }
          if (action === 'print') window.print();
        });
        const story = document.querySelector('[data-story-slug]');
        if (story) {
          const slug = story.dataset.storySlug;
          const recent = getJson('recentStories', []).filter((item) => item !== slug);
          setJson('recentStories', [slug, ...recent].slice(0, 12));
        }
        applyReader();
        renderLists();
      })();
    })();</script> </body> </html>
